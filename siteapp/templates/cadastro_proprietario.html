<!DOCTYPE html>
{% load static %}
<html lang="pt-br" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Proprietário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'siteapp/css/estilo.css' %}" rel="stylesheet">
</head>

<body class="pagina-cadastro">

    <div class="container container-cadastro px-3">
        
        <!-- BLOCO DE ALERTAS DE FEEDBACK FLUTUANTES -->
        {% if messages %}
            <div class="container-alertas mb-4">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show d-flex align-items-center gap-2" role="alert" style="border-radius: 8px; font-weight: 500;">
                        <span style="font-size: 18px;">
                            {% if message.tags == 'success' %}✨
                            {% elif message.tags == 'error' %}⚠️
                            {% else %}ℹ️{% endif %}
                        </span>
                        <div>{{ message }}</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- CARTÃO DO FORMULÁRIO -->
        <div class="card-cadastro p-4 p-md-5">
            <h2 class="mb-4">👤 Cadastrar Proprietário</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: João da Silva" required>
                </div>

                <div class="mb-3">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" name="cpf" oninput="mascaraCPF(this)" maxlength="14" placeholder="000.000.000-00" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone" name="telefone" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000" required>
                </div>

                <div class="mb-3">
                    <label for="endereco" class="form-label">Endereço de Residência</label>
                    <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, número, bairro e cidade">
                </div>

                <!-- CONTAINER DE BOTÕES -->
                <div class="btn-container">
                    <button type="submit" class="btn btn-success btn-acao">Salvar Proprietário</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-acao">Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts de formatação automática em tempo real -->
    <script>
    function mascaraCPF(campo) {
        let valor = campo.value.replace(/\D/g, ""); 
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); 
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); 
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); 
        campo.value = valor;
    }

    function mascaraTelefone(campo) {
        let valor = campo.value.replace(/\D/g, ""); 
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2"); 
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2"); 
        campo.value = valor;
    }
    </script>

    <!-- INTERATIVIDADE DO BOOTSTRAP PARA FECHAR ALERTAS -->
     <!-- essa parte nao estava nem sendo carregada pelo browser.
    o trecho `<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">`
    já é suficiente.
    caso necessário, ajuste aqui. -->
    <!-- <script src="https://jsdelivr.net"></script> -->

</body>
</html>
