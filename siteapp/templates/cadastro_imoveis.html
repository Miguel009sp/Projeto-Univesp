<!DOCTYPE html>
{% load static %}
<html lang="pt-br" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if imovel %}Editar Imóvel{% else %}Cadastrar Imóvel{% endif %}</title>
    <link href="{% static 'siteapp/css/estilo.css' %}" rel="stylesheet">
</head>

<body class="notranslate form-imovel">
    <h2>{% if imovel %}Editar Imóvel{% else %}Cadastrar Imóvel{% endif %}</h2>

    <form method="post" enctype="multipart/form-data" id="form-imovel" onsubmit="limparMascarasAntesDeEnviar(event)">
        {% csrf_token %}

        <div class="form-group">
            <label for="usuario">Responsável / Usuário</label>
            <select name="usuario" id="usuario">
                <option value="">-- Selecione o Usuário --</option>
                {% for u in usuarios %}
                    <option value="{{ u.id }}" {% if imovel and imovel.user_id == u.id %}selected{% endif %}>
                        {{ u.nome|default:u.username }} ({% if u.role %}{{ u.get_role_display }}{% else %}Sem Role{% endif %})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="tipo_imovel">Tipo do imóvel</label>
            <select name="tipo_imovel" id="tipo_imovel">
                <option {% if imovel and "Casa" in imovel.nome %}selected{% endif %}>Casa</option>
                <option {% if imovel and "Apartamento" in imovel.nome %}selected{% endif %}>Apartamento</option>
                <option {% if imovel and "Terreno" in imovel.nome %}selected{% endif %}>Terreno</option>
                <option {% if imovel and "Sala Comercial" in imovel.nome %}selected{% endif %}>Sala Comercial</option>
                <option {% if imovel and "Galpão Comercial" in imovel.nome %}selected{% endif %}>Galpão Comercial</option>
                <option {% if imovel and "Sítio" in imovel.nome %}selected{% endif %}>Sítio</option>
                <option {% if imovel and "Chácara" in imovel.nome %}selected{% endif %}>Chácara</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status do Imóvel</label>
            <select name="status" id="status">
                <option value="disponivel" {% if imovel.status == "disponivel" %}selected{% endif %}>Disponível</option>
                <option value="indisponivel" {% if imovel.status == "indisponivel" %}selected{% endif %}>Indisponível</option>
                <option value="vendido" {% if imovel.status == "vendido" %}selected{% endif %}>Vendido</option>
            </select>
        </div>

        <div class="form-group">
            <label for="referencia">Número de Referência</label>
            <input type="text" name="referencia" id="referencia" value="{{ imovel.referencia|default:'' }}" placeholder="Ex: REF1020">
        </div>

        <div class="form-group">
            <label for="valor_imovel">Valor do imóvel</label>
            <input type="text" name="valor_imovel" id="valor_imovel" value="{{ imovel.valor_original|default:'' }}" oninput="mascaraMoeda(this)" placeholder="R$ 0,00">
        </div>

        <div class="form-group">
            <label for="proprietario_documento">Proprietário (CPF/CNPJ)</label>
            <input type="text" name="proprietario_documento" id="proprietario_documento" value="{{ imovel.proprietario_documento|default:'' }}" oninput="mascaraCPFouCNPJ(this)" placeholder="000.000.000-00 ou 00.000.000/0000-00" maxlength="18">
        </div>

        <div class="form-group">
            <label for="cep">CEP</label>
            <input type="text" name="cep" id="cep" value="{{ imovel.endereco.cep|default:'' }}" oninput="mascaraCEP(this)" onblur="buscarEnderecoPeloCEP(this.value)" placeholder="00000-000" maxlength="9" aria-describedby="ajuda-cep erro-cep">
            <small id="ajuda-cep" style="display: block; margin-top: 5px; font-size: 13px; color: #6c757d;">Ao digitar o CEP completo, logradouro, bairro, cidade e estado são preenchidos automaticamente.</small>
            <small id="erro-cep" role="alert" style="color: red; display: none; margin-top: 5px; font-size: 13px;"></small>
        </div>

        <div class="form-group">
            <label for="logradouro">Logradouro (Rua / Avenida) <span style="font-weight:400;color:#6c757d;">(preenchido pelo CEP)</span></label>
            <input type="text" name="logradouro" id="logradouro" value="{{ imovel.endereco.logradouro|default:'' }}" class="campo-automatico" placeholder="Aguardando CEP..." readonly aria-readonly="true">
        </div>

        <div class="form-group">
            <label for="numero">Número</label>
            <input type="text" name="numero" id="numero" value="{{ imovel.endereco.numero|default:'' }}" placeholder="Digite o número manualmente">
        </div>

        <div class="form-group">
            <label for="bairro">Bairro <span style="font-weight:400;color:#6c757d;">(preenchido pelo CEP)</span></label>
            <input type="text" name="bairro" id="bairro" value="{{ imovel.endereco.bairro|default:'' }}" class="campo-automatico" placeholder="Aguardando CEP..." readonly aria-readonly="true">
        </div>

        <div class="form-group">
            <label for="cidade">Cidade <span style="font-weight:400;color:#6c757d;">(preenchido pelo CEP)</span></label>
            <input type="text" name="cidade" id="cidade" value="{{ imovel.endereco.localidade|default:'' }}" class="campo-automatico" placeholder="Aguardando CEP..." readonly aria-readonly="true">
        </div>

        <div class="form-group">
            <label for="estado">Estado (Sigla) <span style="font-weight:400;color:#6c757d;">(preenchido pelo CEP)</span></label>
            <input type="text" name="estado" id="estado" value="{{ imovel.endereco.sigla_federacao|default:'' }}" class="campo-automatico" placeholder="EX: SP" maxlength="2" style="text-transform: uppercase;" readonly aria-readonly="true">
        </div>

        <div class="form-group largo">
            <label for="descricao">Descrição do Imóvel</label>
            <textarea name="descricao" id="descricao" placeholder="Digite detalhes sobre o imóvel (quartos, suítes, vaga de garagem, etc...)">{{ imovel.descricao|default:'' }}</textarea>
        </div>

        <div class="form-group">
            <label for="foto_principal">Foto Principal {% if imovel %}(Deixe vazio para manter a atual){% endif %}</label>
            <div class="upload-container">
                <input type="file" name="foto_principal" id="foto_principal" class="input-file-oculto" accept="image/*" onchange="atualizarNomeArquivo(this)">
                <div class="botao-upload-custom">
                    <span id="texto-upload">Selecionar Imagem</span>
                </div>
            </div>
            <span class="nome-arquivo" id="nome-arquivo-selecionado"></span>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn btn-salvar">Salvar</button>
            <a href="javascript:history.back()" class="btn btn-voltar">Voltar</a>
        </div>
    </form>

    <script>
        function mascaraMoeda(campo) {
            let valor = campo.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            campo.value = valor ? "R$ " + valor : "";
        }

        function mascaraCPFouCNPJ(campo) {
            let valor = campo.value.replace(/\D/g, "");
            if (valor.length <= 11) {
                valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
                valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
                valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            } else {
                valor = valor.replace(/^(\d{2})(\d)/, "$1.$2");
                valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                valor = valor.replace(/\.(\d{3})(\d)/, ".$1/$2");
                valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
            }
            campo.value = valor;
        }

        function mascaraCEP(campo) {
            let valor = campo.value.replace(/\D/g, "");
            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
            campo.value = valor;
        }

        function buscarEnderecoPeloCEP(cep) {
            const cepLimpo = cep.replace(/\D/g, "");
            const erroInput = document.getElementById("erro-cep");
            
            if (cepLimpo.length !== 8) return;

            fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                .then(response => response.json())
                .then(dados => {
                    if (dados.erro) {
                        erroInput.textContent = "CEP não encontrado.";
                        erroInput.style.display = "block";
                        limparCamposEndereco();
                    } else {
                        erroInput.style.display = "none";
                        document.getElementById("logradouro").value = dados.logradouro || "";
                        document.getElementById("bairro").value = dados.bairro || "";
                        document.getElementById("cidade").value = dados.localidade || "";
                        document.getElementById("estado").value = dados.uf || "";
                        document.getElementById("numero").focus();
                    }
                })
                .catch(() => {
                    erroInput.textContent = "Erro ao buscar o CEP.";
                    erroInput.style.display = "block";
                    limparCamposEndereco();
                });
        }

        function limparCamposEndereco() {
            document.getElementById("logradouro").value = "";
            document.getElementById("bairro").value = "";
            document.getElementById("cidade").value = "";
            document.getElementById("estado").value = "";
        }

        function atualizarNomeArquivo(input) {
            if (input.files && input.files.length > 0) {
                const nomeArquivo = input.files[0].name;
                document.getElementById("nome-arquivo-selecionado").textContent = "Arquivo: " + nomeArquivo;
                document.getElementById("texto-upload").textContent = "Alterar Imagem";
            }
        }

        function limparMascarasAntesDeEnviar(event) {
            const campoValor = document.getElementById("valor_imovel");
            const campoDocumento = document.getElementById("proprietario_documento");
            const campoCep = document.getElementById("cep");

            if (campoValor.value) {
                let valorLimpo = campoValor.value.replace("R$", "").replace(/\./g, "").replace(",", ".").trim();
                campoValor.value = valorLimpo;
            }

            if (campoDocumento.value) {
                campoDocumento.value = campoDocumento.value.replace(/\D/g, "");
            }

            if (campoCep.value) {
                campoCep.value = campoCep.value.replace(/\D/g, "");
            }
        }
    </script>
</body>
</html>
